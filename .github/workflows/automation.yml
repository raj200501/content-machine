name: content-machine-automation

on:
  schedule:
    # GitHub's scheduler often fires late or skips runs, so this tries every
    # hour from about 7am to 11pm New York time (UTC hours below) and the app
    # decides what is due. Runs with nothing to do exit after a quick check.
    - cron: "23 0-4,11-23 * * *"
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Reels to render and post right now (0 = only what is due)"
        default: "1"

concurrency:
  group: content-machine-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only INSTAGRAM_ACCESS_TOKEN is required (a long-lived user token or a Page token). Turso is optional: without it,
      # state (the SQLite DB) is carried between runs with the Actions cache.
      AUTOMATION_READY: ${{ secrets.INSTAGRAM_ACCESS_TOKEN != '' && 'true' || 'false' }}
      USE_TURSO: ${{ secrets.TURSO_DATABASE_URL != '' && secrets.TURSO_AUTH_TOKEN != '' && 'true' || 'false' }}
      PIPER_VOICE: en_US-lessac-medium
    steps:
      - name: Skip until required secrets exist
        if: env.AUTOMATION_READY != 'true'
        run: echo "Required GitHub Actions secrets are still missing. Skipping automation run."

      - name: Check out repository
        if: env.AUTOMATION_READY == 'true'
        uses: actions/checkout@v4

      - name: Restore state database
        if: env.AUTOMATION_READY == 'true' && env.USE_TURSO != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/content_machine.db
          key: content-machine-state-${{ github.run_id }}
          restore-keys: content-machine-state-

      - name: Anything to do?
        id: window
        if: env.AUTOMATION_READY == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run."
          else
            python3 scripts/needs_work.py output/content_machine.db
          fi

      - name: Set up Python
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install cloudflared
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Install Python dependencies
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore voice models
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: assets/voices
          key: voices-kokoro-v1.0-${{ env.PIPER_VOICE }}

      - name: Download voice models if missing
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          ./scripts/install_kokoro.sh
          ./scripts/install_piper_voice.sh "$PIPER_VOICE" || echo "Piper fallback voice unavailable; Kokoro will be used."

      - name: Run automation tick
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TIMEZONE: America/New_York
          POSTS_PER_DAY: "5"
          PUBLISH_NOW_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_now || '0' }}
          BATCH_RENDER_SIZE: "5"
          DRY_RUN: "false"
          ENABLE_VIDEO_PROVIDER: "false"
          ENABLE_LOCAL_FALLBACK: "true"
          ENABLE_YOUTUBE_TRANSCRIPTS: "true"
          PUBLICATION_START_HOUR: "8"
          PUBLICATION_END_HOUR: "22"
          DELETE_STAGED_MEDIA_AFTER_PUBLISH: "true"
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          LOG_LEVEL: INFO
        run: |
          python -m app.cli init-db
          ./scripts/run_with_public_media_tunnel.sh python -m app.cli automation-tick

      - name: Save state database
        if: always() && env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true' && env.USE_TURSO != 'true'
        uses: actions/cache/save@v4
        with:
          path: output/content_machine.db
          key: content-machine-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload rendered reels
        if: always() && env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: output/rendered/**/*.mp4
          retention-days: 3
          if-no-files-found: ignore
