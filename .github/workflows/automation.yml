name: content-machine-automation

on:
  # Keep scheduling disabled by default for private repos. Use local cron for the
  # guaranteed zero-dollar setup, or re-add a schedule only after confirming the
  # repository is public or private Actions minutes are safely within quota.
  workflow_dispatch:

concurrency:
  group: content-machine-automation
  cancel-in-progress: false

jobs:
  automation:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_READY: ${{ secrets.INSTAGRAM_ACCESS_TOKEN != '' && secrets.INSTAGRAM_IG_USER_ID != '' && secrets.INSTAGRAM_APP_ID != '' && secrets.INSTAGRAM_APP_SECRET != '' && secrets.TURSO_DATABASE_URL != '' && secrets.TURSO_AUTH_TOKEN != '' && secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' && secrets.PUBLIC_MEDIA_BASE_URL != '' && 'true' || 'false' }}
    steps:
      - name: Skip until required secrets exist
        if: env.AUTOMATION_READY != 'true'
        run: echo "Required GitHub Actions secrets are still missing. Skipping automation run."

      - name: Check out repository
        if: env.AUTOMATION_READY == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.AUTOMATION_READY == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        if: env.AUTOMATION_READY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: env.AUTOMATION_READY == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation tick
        if: env.AUTOMATION_READY == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_MEDIA_BASE_URL: ${{ secrets.PUBLIC_MEDIA_BASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TIMEZONE: America/New_York
          POSTS_PER_DAY: "5"
          BATCH_RENDER_SIZE: "5"
          DRY_RUN: "false"
          ENABLE_VIDEO_PROVIDER: "false"
          ENABLE_LOCAL_FALLBACK: "true"
          ENABLE_YOUTUBE_TRANSCRIPTS: "true"
          PUBLICATION_START_HOUR: "8"
          PUBLICATION_END_HOUR: "22"
          DELETE_STAGED_MEDIA_AFTER_PUBLISH: "true"
          LOG_LEVEL: INFO
        run: |
          python -m app.cli init-db
          python -m app.cli automation-tick
