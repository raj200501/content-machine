name: content-machine-automation

on:
  schedule:
    # GitHub cron is UTC. These cover the five New York publish windows in
    # both daylight and standard time; the first live run also refreshes/plans.
    - cron: "5 2,3,12,13,19,20 * * *"
    - cron: "35 15,16,22,23 * * *"
  workflow_dispatch:

concurrency:
  group: content-machine-automation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the four Instagram secrets are required. Turso is optional: without it,
      # state (the SQLite DB) is carried between runs with the Actions cache.
      AUTOMATION_READY: ${{ secrets.INSTAGRAM_ACCESS_TOKEN != '' && secrets.INSTAGRAM_IG_USER_ID != '' && secrets.INSTAGRAM_APP_ID != '' && secrets.INSTAGRAM_APP_SECRET != '' && 'true' || 'false' }}
      USE_TURSO: ${{ secrets.TURSO_DATABASE_URL != '' && secrets.TURSO_AUTH_TOKEN != '' && 'true' || 'false' }}
      PIPER_VOICE: en_US-lessac-medium
    steps:
      - name: Skip until required secrets exist
        if: env.AUTOMATION_READY != 'true'
        run: echo "Required GitHub Actions secrets are still missing. Skipping automation run."

      - name: Check publish window
        id: window
        if: env.AUTOMATION_READY == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_time="$(TZ=America/New_York date +%H:%M)"
          case "$local_time" in
            08:*|11:3*|15:*|18:3*|22:*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Outside publish window: $local_time America/New_York"
              ;;
          esac

      - name: Check out repository
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ffmpeg
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Install cloudflared
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Install Python dependencies
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore voice model
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: assets/voices
          key: piper-voice-${{ env.PIPER_VOICE }}

      - name: Download voice model if missing
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        run: ./scripts/install_piper_voice.sh "$PIPER_VOICE"

      - name: Restore state database
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true' && env.USE_TURSO != 'true'
        uses: actions/cache/restore@v4
        with:
          path: output/content_machine.db
          key: content-machine-state-${{ github.run_id }}
          restore-keys: content-machine-state-

      - name: Run automation tick
        if: env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TIMEZONE: America/New_York
          POSTS_PER_DAY: "5"
          BATCH_RENDER_SIZE: "5"
          DRY_RUN: "false"
          ENABLE_VIDEO_PROVIDER: "false"
          ENABLE_LOCAL_FALLBACK: "true"
          ENABLE_YOUTUBE_TRANSCRIPTS: "true"
          PUBLICATION_START_HOUR: "8"
          PUBLICATION_END_HOUR: "22"
          DELETE_STAGED_MEDIA_AFTER_PUBLISH: "true"
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          LOG_LEVEL: INFO
        run: |
          python -m app.cli init-db
          ./scripts/run_with_public_media_tunnel.sh python -m app.cli automation-tick

      - name: Save state database
        if: always() && env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true' && env.USE_TURSO != 'true'
        uses: actions/cache/save@v4
        with:
          path: output/content_machine.db
          key: content-machine-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload rendered reels
        if: always() && env.AUTOMATION_READY == 'true' && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          path: output/rendered/**/*.mp4
          retention-days: 3
          if-no-files-found: ignore
