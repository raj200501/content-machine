[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-machine"
version = "0.1.0"
description = "Automated Instagram reels pipeline for early-career tech job seekers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "libsql>=0.1",
  "Pillow>=10.3",
  "playwright>=1.45",
  "numpy>=1.26",
  "kokoro-onnx>=0.5,<0.7",
  "piper-tts>=1.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "rich>=13.7",
  "tenacity>=8.2",
  "trafilatura>=1.9",
  "typer>=0.12",
  "youtube-transcript-api>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
